# Publish the container image to GitHub's registry on a version tag (DEPLOY-05).
#
#   git tag v0.7.4 && git push origin v0.7.4
#
# Produces ghcr.io/<owner>/bitt:0.7.4, :0.7, and :latest, for linux/amd64 and
# linux/arm64 -- the second is not optional for this project, since a household
# instance is as likely to be on a Raspberry Pi as on a server.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs are for re-publishing a tag after a registry problem, not for
  # cutting a release: the version comes from internal/version either way.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required for the build to attach a provenance attestation, which is what
  # lets someone verify the image was built from this repository by this
  # workflow rather than pushed by hand.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag that fails its own tests must not become a published image.
      - name: Test
        run: go test ./...

      - name: The tag and internal/version must agree
        # The version is a constant in the source, so a tag that disagrees with
        # it produces an image whose footer and /healthz report a different
        # version from the one people pulled.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(go run ./cmd/bittabby --version | awk '{print $1}' | tr -d 'v')
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match internal/version ($src)"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bitt
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
